[package]
name = "relay-studio"
version = "0.1.0"
description = "Cross-platform multi-model MCP client"
authors = ["Relay Studio"]
edition = "2021"

[lib]
name = "relay_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
